{% extends 'base.html' %}
{% block title %}Login Admin — Dogão & Doguinho{% endblock %}

{% block content %}
<section class="login-section">
  <div class="login-box">
    <div class="login-icon">⚙️</div>
    <h2 class="login-title">Painel Admin</h2>
    <p class="login-sub">Acesso exclusivo para administradores</p>

    <form method="POST" action="{{ url_for('admin_login') }}" class="login-form">
      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="seu usuário" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-login">Entrar no Admin</button>
    </form>

    <a href="{{ url_for('index') }}" class="login-back">← Voltar ao cardápio</a>
  </div>
</section>
{% endblock %}
